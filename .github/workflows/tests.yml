name: tests

# The application has no dependencies and no build step — it is native ES
# modules served as files — so there is nothing to install for the fast suite
# and nothing to cache. Only the browser checks need anything installed, and
# only because driving a browser needs a browser.
#
# Pushes to a branch with an open pull request would otherwise run twice, once
# for the push and once for the pull request, so push is limited to the default
# branch and pull_request covers everything else.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes whatever was already running for the same ref.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Everything below the view layer is DOM-free by construction, so this
      # imports the code that ships rather than a test double of it.
      - name: Run the suite
        run: node tests/run.mjs

      # The single-file build is generated, never committed, so the only way to
      # know it still builds is to build it. Its own audit fails the run if a
      # module has grown an import or export shape the bundler would silently
      # mistranslate.
      - name: Check the single-file build still builds
        run: node tools/bundle.mjs /tmp/familyos.html

      # The web root a native app bundles, and the same one the Pages workflow
      # publishes. It fails when the ship list and the worker's precache list
      # disagree, in either direction — which is the only thing standing
      # between an Android build and a bundle missing a stylesheet.
      - name: Check the web root still assembles
        run: node tools/webroot.mjs

      # The application and apps-script/ are two codebases that must agree about
      # one list of action names, deployed separately. A client calling an
      # action the backend does not serve is a 400 in a household's face.
      - name: Check the application and the backend still agree
        run: node tools/api-contract.mjs --check

      # The custom URL scheme Google answers on is derived from the client id, so
      # it differs per deployment and is not committed. This does nothing in a
      # clone with no configuration, and fails when a configured one has drifted.
      - name: Check the native OAuth scheme matches the configuration
        run: node tools/native-scheme.mjs --check

      # The backend's copy of the access rules is generated from the schema.
      # Two tables describing one set of rules will disagree, and this is where
      # that gets caught rather than in a household's workbook.
      - name: Check the backend's access rules match the schema
        run: node tools/policy.mjs --check

      # Not a linter — see `tools/lint.mjs` for why there is deliberately none.
      # Five patterns a type checker cannot see, every one of them at zero, and
      # the value is in the direction this fails: a `console.log` pasted into a
      # screen that renders a PAN prints it into a browser console.
      - name: Check nothing shipped can leak or execute a string
        run: node tools/lint.mjs

      # The architecture document describes a codebase, and a description goes
      # stale silently. Thirteen of its rows still said "missing" about things
      # built phases earlier, so every row now carries a probe and this fails
      # when one disagrees — in either direction.
      - name: Check the architecture document still describes this repository
        run: node tools/architecture.mjs

  # Types are checked, never compiled: the application ships the JavaScript in
  # this repository and nothing here touches a byte of it. A separate job so a
  # failure reads as "types" rather than as "the suite broke", and because it is
  # the only part of the fast path that needs anything installed.
  #
  # It enforces a budget rather than zero. The number lives in
  # `tools/typecheck-budget.json`, may only go down, and the tool explains why
  # that is the honest shape for a codebase of 25,000 previously unchecked lines.
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Check the types
        run: node tools/typecheck.mjs

  # A separate job because it downloads a browser, which is minutes rather than
  # seconds. Keeping it apart means the fast suite still reports quickly and a
  # failure here is attributable to the browser rather than to logic.
  #
  # Fifteen minutes was the ceiling until this suite was measured against it.
  # Instrumenting all 87 sections put a passing run at 785 seconds — 13
  # minutes — on a machine faster than this runner, and the cost is spread
  # across the whole file rather than sitting in one place: the six most
  # expensive sections are 79s, 68s, 64s, 53s, 48s and 47s, and no single one
  # is more than a tenth of the total.
  #
  # So the job was not slow because of one bad check. It had been within a
  # minute or two of the ceiling for some time, and the next block added —
  # whichever it turned out to be — was always going to tip it. It did: a
  # cancelled run reads as a red cross with no failing assertion behind it,
  # which is the least useful failure a suite can produce.
  #
  # Twenty-five, then, with the newest and most expensive section trimmed to
  # a third of its cost in the same change. Not skipping a check to fit, and
  # not a number picked to be comfortably out of reach — enough that a run
  # which finishes is reported on what it found, and little enough that one
  # which hangs is still cut off.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # First run, a save through the real form, a reload that relocks, and
      # every screen — failing on any console error, any empty render, or any
      # horizontal overflow at 390px.
      # `--shots` so a failure leaves something to look at; the screenshots are
      # only uploaded when the run fails.
      - name: Run the browser checks
        run: node tests/browser.mjs --shots

      - name: Keep the screenshots when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shots/
          if-no-files-found: ignore
