name: android

# Build the Android app, and hand back something you can install.
#
# This exists because the machine the integration was written on could not do
# it: its network answers 403 for dl.google.com, so Gradle cannot fetch the
# Android Gradle Plugin, and there is no Android SDK on it either. "The native
# project compiles" was therefore a claim nobody was entitled to make.
#
# A GitHub runner can make it. The ubuntu image ships the Android SDK and can
# reach Google, so this is the first place the Android build is actually
# exercised — and the APK it uploads is the artifact to download and install on
# a phone.
#
# It is a separate workflow from `tests` so that a failure reads as "the
# Android build" rather than "the suite broke", and so the fast checks still
# report in seconds while this one takes minutes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Capacitor 8 wants a JDK 21. Pinned rather than inherited, because the
      # runner image's default has moved before and a toolchain that changes
      # underneath you produces a failure nobody can attribute.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # What the runner actually has, printed before anything depends on it.
      # A build that fails on a missing platform should say so here rather than
      # a hundred lines into Gradle's output.
      - name: Show the toolchain
        run: |
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || true
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" || true

      - run: npm ci --no-audit --no-fund

      # The production web root — not `npm run build`, which writes a
      # single-file preview with no service worker. `cap sync` copies this into
      # the native project and would fail outright if it were missing.
      - name: Assemble the web root
        run: node tools/webroot.mjs

      - name: Sync the Android project
        run: npx cap sync android

      # The web assets are copied into the native project rather than committed,
      # so this is where a broken sync would show up as a missing index.html
      # instead of as a blank screen on somebody's phone.
      - name: Check the app was actually copied in
        run: |
          test -f android/app/src/main/assets/public/index.html
          echo "$(find android/app/src/main/assets/public -type f | wc -l) files bundled"

      # Both flavours. `standard` is the one that installs: Play Protect
      # blocks a sideloaded app asking for READ_SMS outright, which was making
      # every other feature in this build unreachable on a phone.
      # A GitHub secret holds text; a keystore is binary. So it travels as
      # base64 and is decoded here, and the FIRST version of this workflow got
      # that wrong: it passed `secrets.FAMILYOS_KEYSTORE_PATH` straight to
      # Gradle as a path, and nothing ever put a file there. With no secrets
      # set the fallback hid it — which is the only path CI had ever run — and
      # with secrets set the build would have failed on a missing file rather
      # than signed anything.
      #
      # Decoded into RUNNER_TEMP rather than the workspace, so nothing that
      # archives the checkout can pick it up, and never echoed. The runner is
      # discarded after the job.
      - name: Put the signing key on disk, if there is one
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.FAMILYOS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FAMILYOS_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "no FAMILYOS_KEYSTORE_BASE64 — the release will be signed with the debug key"
            exit 0
          fi

          STORE="${RUNNER_TEMP}/familyos-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$STORE" 2>/dev/null \
            || { echo "::error::FAMILYOS_KEYSTORE_BASE64 is not valid base64"; exit 1; }

          [ -s "$STORE" ] \
            || { echo "::error::FAMILYOS_KEYSTORE_BASE64 decoded to an empty file"; exit 1; }

          # A truncated secret or a wrong password fails here, saying which,
          # rather than surfacing later as an opaque Gradle signing error.
          # `keytool -list` prints the store's contents, so its output is
          # discarded; only the exit status is used.
          keytool -list -keystore "$STORE" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1 \
            || { echo "::error::the decoded keystore did not open with FAMILYOS_KEYSTORE_PASSWORD"; exit 1; }

          echo "keystore=$STORE" >> "$GITHUB_OUTPUT"
          echo "decoded a keystore for signing"

      - name: Build both release APKs
        working-directory: android
        # Release, not debug. A debug build carries android:debuggable="true",
        # which lets `adb run-as com.familyos.app` read the WebView's IndexedDB
        # — records and wrapped key material — off an unrooted phone with only
        # USB debugging on. Every APK this workflow ever handed anybody was a
        # debug build. See the `release` block in android/app/build.gradle.
        #
        # Signed with the household keystore when the secrets below are set,
        # and with the SDK debug key when they are not. The fallback is not
        # distributable and Play will reject it; it is still not debuggable,
        # which is the part that mattered.
        env:
          # Empty when the step above found no secret, which is what makes
          # `build.gradle` take the debug-key fallback.
          FAMILYOS_KEYSTORE: ${{ steps.signing.outputs.keystore }}
          FAMILYOS_KEYSTORE_PASSWORD: ${{ secrets.FAMILYOS_KEYSTORE_PASSWORD }}
          FAMILYOS_KEY_ALIAS: ${{ secrets.FAMILYOS_KEY_ALIAS }}
          FAMILYOS_KEY_PASSWORD: ${{ secrets.FAMILYOS_KEY_PASSWORD }}
        run: ./gradlew assembleStandardRelease assembleSmsRelease --no-daemon --stacktrace

      - name: Say what came out
        run: |
          find android/app/build/outputs/apk -name '*.apk' -exec ls -lh {} +

      # Check the split actually held. A flavour that quietly picked up the
      # restricted permission would install-block exactly like the old single
      # build, and the only way anybody would find out is by trying it on a
      # phone — which is how this was found the first time.
      - name: Check the standard flavour asks for no restricted permission
        run: |
          AAPT=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools"             -name aapt2 | sort | tail -1)
          APK=$(find android/app/build/outputs/apk/standard -name '*.apk' | head -1)
          echo "reading $APK"
          PERMS=$("$AAPT" dump permissions "$APK")
          echo "$PERMS"
          for p in READ_SMS RECEIVE_SMS SEND_SMS READ_CALL_LOG WRITE_CALL_LOG; do
            echo "$PERMS" | grep -q "android.permission.$p" \
              && { echo "::error::standard asks for $p — Play Protect will block it"; exit 1; } \
              || true
          done
          echo "standard is clean"

      # The source manifest is checked by `tests/native.test.mjs`. This reads
      # the built APK, which is the only place the attribute has actually
      # survived manifest merging and aapt2 — a library or a build type can
      # override it, and a source grep would never know.
      #
      # 0x10 is SOFT_INPUT_ADJUST_RESIZE. Unset is 0x00 (UNSPECIFIED), which
      # is the thing this exists to rule out, so the value is compared and not
      # merely found.
      - name: Check the shipped APK resizes for the keyboard
        run: |
          AAPT=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" \
            -name aapt2 | sort | tail -1)
          APK=$(find android/app/build/outputs/apk/standard -name '*.apk' | head -1)
          TREE=$("$AAPT" dump xmltree --file AndroidManifest.xml "$APK")
          MODE=$(echo "$TREE" | grep -o 'windowSoftInputMode[^=]*=[^ ]*' | head -1)
          echo "found: ${MODE:-nothing}"
          echo "$MODE" | grep -qi '0x0*10$' \
            || { echo "::error::the app window is not adjustResize (${MODE:-unset}) — the keyboard will pan the window on some devices"; exit 1; }
          echo "the app window resizes for the keyboard"

      # The whole reason this workflow builds `release` rather than `debug`.
      #
      # `android:debuggable="true"` is injected by AGP into a debug build and
      # permits `adb run-as com.familyos.app` on an unrooted phone, which reads
      # the WebView's IndexedDB: a household's records and the wrapped key
      # material beside them. Read out of the BUILT APK rather than grepped for
      # in source, because a build type or a merged library manifest can put
      # the attribute back and a source grep would never know — which is
      # exactly how the debug build went unnoticed for as long as it did.
      #
      # aapt2 prints the attribute only when it is present, so its absence is
      # the pass. `grep -q` on the tree would invert that and pass on a typo.
      - name: Check the shipped APK is not debuggable
        run: |
          AAPT=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" \
            -name aapt2 | sort | tail -1)
          for APK in $(find android/app/build/outputs/apk -name '*.apk'); do
            echo "reading $APK"
            TREE=$("$AAPT" dump xmltree --file AndroidManifest.xml "$APK")
            if echo "$TREE" | grep -qi 'debuggable'; then
              echo "$TREE" | grep -i 'debuggable'
              echo "::error::$APK is debuggable — adb run-as can read the encrypted store off an unrooted phone"
              exit 1
            fi
          done
          echo "neither APK is debuggable"

      - name: And that the sms flavour still has it
        run: |
          AAPT=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools"             -name aapt2 | sort | tail -1)
          APK=$(find android/app/build/outputs/apk/sms -name '*.apk' | head -1)
          "$AAPT" dump permissions "$APK" | grep -q 'android.permission.READ_SMS' \
            || { echo "::error::the sms flavour lost READ_SMS — Phase 6 cannot work"; exit 1; }
          echo "sms flavour still reads an inbox"

      # Renamed before upload, because the artifact names alone were not
      # enough. `familyos-apk-installable` and `familyos-apk-with-sms` sit
      # next to each other on the run page, and the first person to use them
      # downloaded the blocked one — then saw the same Play Protect dialog
      # the split existed to remove, with no way to tell from the filename
      # (`app-sms-debug.apk`) which build they had.
      #
      # So the file says what it is. Somebody who ends up at the dialog can
      # now read the name in the file manager and know why.
      - name: Name the files after what they do
        run: |
          mkdir -p upload/install upload/sms
          cp android/app/build/outputs/apk/standard/release/*.apk \
             upload/install/familyos-INSTALL-THIS.apk
          cp android/app/build/outputs/apk/sms/release/*.apk \
             upload/sms/familyos-sms-BLOCKED-BY-PLAY-PROTECT.apk
          ls -lh upload/install upload/sms

      # THIS is the one to install. A release build: not debuggable, so the
      # store cannot be pulled off the phone with `adb run-as`. Whether it is
      # *distributable* depends on the signing key — with no household keystore
      # configured it carries the SDK debug key, which Play will not accept and
      # which gives no upgrade integrity.
      - uses: actions/upload-artifact@v4
        with:
          name: 1-INSTALL-THIS-familyos
          path: upload/install/*.apk
          if-no-files-found: error

      # Android refuses this one until Play Protect is switched off. It is
      # here for anybody who wants Phase 6's inbox read and is willing to do
      # that. Numbered second so the run page lists it second.
      - uses: actions/upload-artifact@v4
        with:
          name: 2-BLOCKED-sms-build-needs-play-protect-off
          path: upload/sms/*.apk
          if-no-files-found: error
