name: deploy

# FamilyOS is served as native ES modules with no build step, so "deploying"
# is copying the application's own files to a host that speaks HTTPS. That is
# not a convenience here — two things need a real origin and cannot work from
# a file on disk:
#
#   - Installing it. A browser only offers "Install app" for a page served
#     over HTTPS with a registered service worker.
#   - Signing in with Google, for backup and for reading receipts out of Gmail.
#     OAuth redirects to a URI registered on the client, and a `file://` page
#     has no origin to register.
#
# The Netlify configuration in `netlify.toml` does the same job for anyone who
# prefers it. Both can coexist; neither is required by the other.

on:
  push:
    branches: [main]
  workflow_dispatch:

# `pages: write` and `id-token: write` are what the deploy action needs;
# `contents: read` is everything else this workflow does.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one half-done: a partially replaced
# site is worse than an old complete one. Queued rather than superseded.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `enablement: true` turns Pages on through the API if it is not already,
      # so a fresh fork deploys without anybody visiting a settings screen.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Only the files the application actually serves. The repository also
      # holds its tests, its tooling and the Apps Script backend's source —
      # all public already, none of it any use to a browser, and every one of
      # them a file a host would have to send.
      #
      # The list, and the check that guards it, used to live here inline. They
      # moved into `tools/webroot.mjs` when Capacitor arrived needing the same
      # web root in a directory of its own — a third copy of one list is how
      # lists drift, and this repository has found that fault four times over.
      # The tool copies, then refuses to finish if anything `sw.js` precaches
      # is missing from what it copied.
      - name: Assemble the site
        run: node tools/webroot.mjs _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
