apply plugin: 'com.android.application'

android {
    namespace = "com.familyos.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.familyos.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    /*
     * Two flavours, and the difference between them is one permission.
     *
     * Google Play Protect BLOCKS the install of a sideloaded app that asks for
     * a restricted permission — the SMS and Call Log family. Not a warning
     * that can be dismissed: the dialog offers only OK and the app does not
     * install. `READ_SMS` was therefore making every other feature in this
     * build unreachable, on a phone, for the household it was written for.
     *
     *   standard  no READ_SMS. Installs. Phase 6's native inbox read reports
     *             DENIED, which is a path js/core/smsinbox.js already had.
     *   sms       READ_SMS. Everything works and Play Protect has to be turned
     *             off before Android will install it.
     *
     * Deliberately the SAME applicationId. A suffix would let both sit on one
     * phone and would also change the OAuth redirect scheme that
     * `tools/native-scheme.mjs` checks against the configuration — breaking
     * Google sign-in to gain something nobody asked for.
     */
    flavorDimensions += "capability"

    productFlavors {
        standard {
            dimension "capability"
            // Nothing here on purpose. `standard` is `src/main` exactly.
        }
        sms {
            dimension "capability"
            // Adds src/sms/AndroidManifest.xml, which is READ_SMS and the
            // telephony feature declaration that exists only for it.
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // BiometricPrompt, and the Keystore binding that makes a fingerprint
    // produce key material rather than merely assert who is holding the phone.
    implementation "androidx.biometric:biometric:$androidxBiometricVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
